<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGrad4)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="900" fill="url(#sidebarGrad)"/>
  <line x1="220" y1="0" x2="220" y2="900" stroke="#374151" stroke-width="1"/>

  <!-- Logo -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#005CCE"/>
    <text x="20" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">V</text>
    <text x="50" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Verity</text>
    <text x="50" y="38" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">Trust Infrastructure</text>
  </g>

  <!-- Nav Items -->
  <g transform="translate(0, 100)">
    <!-- Overview (Active) -->
    <rect x="10" y="0" width="200" height="44" rx="8" fill="#005CCE" fill-opacity="0.2"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#005CCE"/>
    <text x="50" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">Overview</text>
    <text x="25" y="28" text-anchor="middle" fill="#005CCE" font-family="system-ui, sans-serif" font-size="16">📊</text>

    <!-- Intake -->
    <g transform="translate(0, 54)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">File Intake</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">📥</text>
    </g>

    <!-- Files -->
    <g transform="translate(0, 108)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Files</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">📁</text>
      <rect x="175" y="12" width="24" height="20" rx="10" fill="#005CCE"/>
      <text x="187" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">20</text>
    </g>

    <!-- Policies -->
    <g transform="translate(0, 162)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Policies</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">⚙️</text>
    </g>

    <!-- Audit -->
    <g transform="translate(0, 216)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Audit Log</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">📋</text>
    </g>

    <!-- Settings -->
    <g transform="translate(0, 270)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Settings</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">🔧</text>
    </g>

    <!-- Public Verify -->
    <g transform="translate(0, 340)">
      <line x1="20" y1="0" x2="200" y2="0" stroke="#374151" stroke-width="1"/>
      <text x="20" y="25" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">EXTERNAL</text>
    </g>

    <g transform="translate(0, 370)">
      <rect x="10" y="0" width="200" height="44" rx="8" fill="transparent"/>
      <text x="50" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Public Verify</text>
      <text x="25" y="28" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="16">🔍</text>
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(240, 20)">
    <!-- Header -->
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">Overview</text>
    <text x="0" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Trust infrastructure dashboard and analytics</text>

    <!-- KPI Cards Row -->
    <g transform="translate(0, 80)">
      <!-- Total Files -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="270" height="110" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Total Files</text>
        <text x="20" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="bold">1,247</text>
        <text x="20" y="95" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12">↑ 12% from last week</text>
      </g>

      <!-- Verified -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="270" height="110" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Verified</text>
        <text x="20" y="70" fill="#22c55e" font-family="system-ui, sans-serif" font-size="36" font-weight="bold">1,156</text>
        <text x="120" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">(92.7%)</text>
        <text x="20" y="95" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Trusted content</text>
      </g>

      <!-- Blocked -->
      <g transform="translate(570, 0)">
        <rect x="0" y="0" width="270" height="110" rx="12" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
        <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Blocked</text>
        <text x="20" y="70" fill="#ef4444" font-family="system-ui, sans-serif" font-size="36" font-weight="bold">23</text>
        <text x="80" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">(1.8%)</text>
        <text x="20" y="95" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Failed verification</text>
      </g>

      <!-- Avg Score -->
      <g transform="translate(855, 0)">
        <rect x="0" y="0" width="270" height="110" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <text x="20" y="30" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Avg Confidence</text>
        <text x="20" y="70" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="36" font-weight="bold">78.4</text>
        <text x="90" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">/ 100</text>
        <text x="20" y="95" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Grade B average</text>
      </g>
    </g>

    <!-- Charts Row -->
    <g transform="translate(0, 210)">
      <!-- Decision Distribution -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="560" height="300" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Decision Distribution</text>

        <!-- Pie Chart Mock -->
        <g transform="translate(150, 170)">
          <!-- Allow slice -->
          <path d="M 0 0 L 100 0 A 100 100 0 0 1 31 95 Z" fill="#22c55e"/>
          <!-- Warn slice -->
          <path d="M 0 0 L 31 95 A 100 100 0 0 1 -81 59 Z" fill="#eab308"/>
          <!-- Require slice -->
          <path d="M 0 0 L -81 59 A 100 100 0 0 1 -95 -31 Z" fill="#f97316"/>
          <!-- Block slice -->
          <path d="M 0 0 L -95 -31 A 100 100 0 0 1 100 0 Z" fill="#ef4444"/>
        </g>

        <!-- Legend -->
        <g transform="translate(340, 80)">
          <rect x="0" y="0" width="12" height="12" rx="2" fill="#22c55e"/>
          <text x="20" y="10" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Allow (847)</text>

          <rect x="0" y="30" width="12" height="12" rx="2" fill="#eab308"/>
          <text x="20" y="40" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Warn (287)</text>

          <rect x="0" y="60" width="12" height="12" rx="2" fill="#f97316"/>
          <text x="20" y="70" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Require (90)</text>

          <rect x="0" y="90" width="12" height="12" rx="2" fill="#ef4444"/>
          <text x="20" y="100" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Block (23)</text>
        </g>
      </g>

      <!-- Confidence Score Trend -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="560" height="300" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Confidence Score Trend</text>
        <text x="20" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Last 7 days</text>

        <!-- Chart area -->
        <g transform="translate(40, 70)">
          <!-- Grid lines -->
          <line x1="0" y1="0" x2="500" y2="0" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="50" x2="500" y2="50" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="100" x2="500" y2="100" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="150" x2="500" y2="150" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
          <line x1="0" y1="200" x2="500" y2="200" stroke="#374151" stroke-width="1"/>

          <!-- Y-axis labels -->
          <text x="-10" y="5" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">100</text>
          <text x="-10" y="55" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">75</text>
          <text x="-10" y="105" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">50</text>
          <text x="-10" y="155" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">25</text>
          <text x="-10" y="205" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">0</text>

          <!-- Line chart -->
          <polyline points="0,60 70,55 140,45 210,50 280,40 350,35 420,45 490,42" fill="none" stroke="#05B8BC" stroke-width="3"/>

          <!-- Data points -->
          <circle cx="0" cy="60" r="5" fill="#05B8BC"/>
          <circle cx="70" cy="55" r="5" fill="#05B8BC"/>
          <circle cx="140" cy="45" r="5" fill="#05B8BC"/>
          <circle cx="210" cy="50" r="5" fill="#05B8BC"/>
          <circle cx="280" cy="40" r="5" fill="#05B8BC"/>
          <circle cx="350" cy="35" r="5" fill="#05B8BC"/>
          <circle cx="420" cy="45" r="5" fill="#05B8BC"/>
          <circle cx="490" cy="42" r="5" fill="#05B8BC"/>

          <!-- X-axis labels -->
          <text x="0" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Mon</text>
          <text x="70" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Tue</text>
          <text x="140" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Wed</text>
          <text x="210" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Thu</text>
          <text x="280" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Fri</text>
          <text x="350" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Sat</text>
          <text x="420" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Sun</text>
          <text x="490" y="220" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Today</text>
        </g>
      </g>
    </g>

    <!-- Recent Alerts -->
    <g transform="translate(0, 530)">
      <rect x="0" y="0" width="1140" height="320" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Recent Alerts</text>
      <text x="20" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Files requiring attention</text>

      <!-- Alert 1 -->
      <g transform="translate(20, 70)">
        <rect x="0" y="0" width="1100" height="60" rx="8" fill="#0d1117" stroke="#ef4444" stroke-width="1"/>
        <circle cx="25" cy="30" r="12" fill="#ef4444"/>
        <text x="25" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✕</text>
        <text x="50" y="25" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">BLOCKED</text>
        <text x="130" y="25" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">suspicious_video_upload.mp4</text>
        <text x="50" y="45" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Invalid signature chain, failed integrity check</text>
        <text x="1050" y="35" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">2 min ago</text>
      </g>

      <!-- Alert 2 -->
      <g transform="translate(20, 140)">
        <rect x="0" y="0" width="1100" height="60" rx="8" fill="#0d1117" stroke="#eab308" stroke-width="1"/>
        <circle cx="25" cy="30" r="12" fill="#eab308"/>
        <text x="25" y="35" text-anchor="middle" fill="#1f2937" font-family="system-ui, sans-serif" font-size="12">!</text>
        <text x="50" y="25" fill="#eab308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">WARN</text>
        <text x="110" y="25" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">edited_photograph.jpg</text>
        <text x="50" y="45" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">AI modification detected, score 65/100</text>
        <text x="1050" y="35" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">15 min ago</text>
      </g>

      <!-- Alert 3 -->
      <g transform="translate(20, 210)">
        <rect x="0" y="0" width="1100" height="60" rx="8" fill="#0d1117" stroke="#f97316" stroke-width="1"/>
        <circle cx="25" cy="30" r="12" fill="#f97316"/>
        <text x="25" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">?</text>
        <text x="50" y="25" fill="#f97316" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">REQUIRE</text>
        <text x="130" y="25" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">news_submission_batch_042.zip</text>
        <text x="50" y="45" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Missing capture device, needs manual review</text>
        <text x="1050" y="35" text-anchor="end" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">1 hour ago</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="700" y="880" text-anchor="middle" fill="#4b5563" font-family="system-ui, sans-serif" font-size="11">Verity Dashboard - Content Authenticity at Scale</text>
</svg>