<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="uploadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#005CCE" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#005CCE" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad5)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">File Intake Flow</text>
  <text x="600" y="75" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Upload, Hash, Verify, Decide</text>

  <!-- Step 1: Upload -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="260" height="280" rx="16" fill="#1f2937" stroke="#005CCE" stroke-width="2"/>

    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#005CCE"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">1</text>
    <text x="60" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Upload File</text>

    <!-- Upload zone -->
    <rect x="20" y="60" width="220" height="150" rx="12" fill="url(#uploadGrad)" stroke="#005CCE" stroke-width="2" stroke-dasharray="8,4"/>

    <text x="130" y="110" text-anchor="middle" fill="#005CCE" font-family="system-ui, sans-serif" font-size="40">📤</text>
    <text x="130" y="145" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Drag and drop or</text>
    <text x="130" y="165" text-anchor="middle" fill="#005CCE" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">click to browse</text>
    <text x="130" y="195" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Max 100MB • Images, Videos, Docs</text>

    <!-- File info -->
    <text x="20" y="235" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">SELECTED FILE</text>
    <rect x="20" y="245" width="220" height="25" rx="4" fill="#0d1117"/>
    <text x="30" y="262" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">photo_evidence.jpg (2.4 MB)</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(335, 250)">
    <polygon points="0,15 30,0 30,10 70,10 70,20 30,20 30,30" fill="#005CCE"/>
  </g>

  <!-- Step 2: Hash Computation -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="260" height="280" rx="16" fill="#1f2937" stroke="#0088CF" stroke-width="2"/>

    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#0088CF"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">2</text>
    <text x="60" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Compute Hash</text>

    <!-- Hash visualization -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#0d1117" stroke="#374151" stroke-width="1"/>
      <text x="110" y="20" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">SHA-256 HASH (CLIENT-SIDE)</text>

      <text x="10" y="50" fill="#05B8BC" font-family="monospace" font-size="9">a7b9c4d2e8f1...</text>
      <text x="10" y="65" fill="#05B8BC" font-family="monospace" font-size="9">5a3b2c1d0e9f...</text>
      <text x="10" y="80" fill="#05B8BC" font-family="monospace" font-size="9">8f7e6d5c4b3a2190</text>
    </g>

    <!-- Progress -->
    <g transform="translate(20, 165)">
      <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">HASHING PROGRESS</text>
      <rect x="0" y="10" width="220" height="8" rx="4" fill="#374151"/>
      <rect x="0" y="10" width="220" height="8" rx="4" fill="#0088CF"/>
      <text x="110" y="35" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">Complete ✓</text>
    </g>

    <!-- Info -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="220" height="45" rx="6" fill="#1e3a5f"/>
      <text x="10" y="18" fill="#0088CF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ℹ️ Privacy First</text>
      <text x="10" y="35" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Hash computed in browser</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(695, 250)">
    <polygon points="0,15 30,0 30,10 70,10 70,20 30,20 30,30" fill="#0088CF"/>
  </g>

  <!-- Step 3: Verification -->
  <g transform="translate(780, 120)">
    <rect x="0" y="0" width="260" height="280" rx="16" fill="#1f2937" stroke="#05B8BC" stroke-width="2"/>

    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#05B8BC"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">3</text>
    <text x="60" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Run Verification</text>

    <!-- Verification steps -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="220" height="180" rx="8" fill="#0d1117"/>

      <!-- Step items -->
      <g transform="translate(10, 15)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Hash verified</text>
      </g>

      <g transform="translate(10, 40)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Provenance chain valid</text>
      </g>

      <g transform="translate(10, 65)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Signatures verified</text>
      </g>

      <g transform="translate(10, 90)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Log proof obtained</text>
      </g>

      <g transform="translate(10, 115)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Policy evaluated</text>
      </g>

      <g transform="translate(10, 140)">
        <circle cx="10" cy="8" r="8" fill="#22c55e"/>
        <text x="10" y="12" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">✓</text>
        <text x="30" y="12" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11">Trust report generated</text>
      </g>
    </g>

    <!-- Score preview -->
    <g transform="translate(20, 250)">
      <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">CONFIDENCE SCORE</text>
      <text x="140" y="0" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">87/100</text>
    </g>
  </g>

  <!-- Step 4: Decision (Below) -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="1080" height="200" rx="16" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>

    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#22c55e"/>
    <text x="30" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">4</text>
    <text x="60" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Trust Report Generated</text>

    <!-- Report Preview -->
    <g transform="translate(20, 60)">
      <!-- Human Origin -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="250" height="120" rx="8" fill="#0d1117" stroke="#374151" stroke-width="1"/>
        <text x="125" y="25" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">HUMAN-ORIGIN PROOF</text>
        <rect x="60" y="40" width="130" height="35" rx="6" fill="#0d3d2d" stroke="#22c55e" stroke-width="1"/>
        <text x="125" y="64" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">YES</text>
        <text x="125" y="100" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Verified capture device</text>
      </g>

      <!-- Confidence -->
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="250" height="120" rx="8" fill="#0d1117" stroke="#374151" stroke-width="1"/>
        <text x="125" y="25" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">REALITY CONFIDENCE</text>
        <text x="125" y="65" text-anchor="middle" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">87</text>
        <text x="160" y="65" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">/ 100</text>
        <rect x="30" y="80" width="190" height="6" rx="3" fill="#374151"/>
        <rect x="30" y="80" width="165" height="6" rx="3" fill="#05B8BC"/>
        <text x="125" y="105" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Grade A - Highly Trusted</text>
      </g>

      <!-- Decision -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="250" height="120" rx="8" fill="#0d1117" stroke="#374151" stroke-width="1"/>
        <text x="125" y="25" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">CONTEXT POLICY DECISION</text>
        <rect x="60" y="40" width="130" height="35" rx="6" fill="#0d3d2d" stroke="#22c55e" stroke-width="1"/>
        <text x="125" y="64" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">ALLOW</text>
        <text x="125" y="100" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Workflow: news_media</text>
      </g>

      <!-- Actions -->
      <g transform="translate(810, 0)">
        <rect x="0" y="0" width="230" height="120" rx="8" fill="#0d1117" stroke="#374151" stroke-width="1"/>
        <text x="115" y="25" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10">ACTIONS</text>

        <rect x="15" y="40" width="200" height="30" rx="6" fill="#005CCE"/>
        <text x="115" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">View Full Report →</text>

        <rect x="15" y="80" width="95" height="28" rx="6" fill="#374151"/>
        <text x="62" y="98" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="10">Download</text>

        <rect x="120" y="80" width="95" height="28" rx="6" fill="#374151"/>
        <text x="167" y="98" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="10">Share</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="680" text-anchor="middle" fill="#4b5563" font-family="system-ui, sans-serif" font-size="11">Verity Trust Infrastructure - Seamless Content Verification</text>
</svg>