<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#005CCE"/>
      <stop offset="50%" style="stop-color:#0088CF"/>
      <stop offset="100%" style="stop-color:#05B8BC"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">Provenance Chain Verification</text>
  <text x="600" y="75" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Cryptographic Event Chain with Signature Validation</text>

  <!-- Chain connection line -->
  <line x1="180" y1="250" x2="1020" y2="250" stroke="url(#chainGrad)" stroke-width="4" stroke-dasharray="8,4" filter="url(#glow2)"/>

  <!-- Event 1: CAPTURE -->
  <g transform="translate(80, 140)">
    <circle cx="100" cy="110" r="40" fill="#1f2937" stroke="#22c55e" stroke-width="3" filter="url(#glow2)"/>
    <text x="100" y="105" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="24">📷</text>
    <text x="100" y="125" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">✓ VALID</text>

    <rect x="20" y="170" width="160" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="20" y="170" width="160" height="30" rx="8" fill="#22c55e"/>
    <rect x="20" y="192" width="160" height="8" fill="#22c55e"/>
    <text x="100" y="190" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CAPTURE</text>

    <text x="30" y="220" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Event Hash:</text>
    <text x="30" y="235" fill="#05B8BC" font-family="monospace" font-size="9">a1b2c3d4e5f6...</text>

    <text x="30" y="255" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Previous:</text>
    <text x="30" y="270" fill="#6b7280" font-family="monospace" font-size="9">null (genesis)</text>

    <text x="30" y="290" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Device:</text>
    <text x="30" y="305" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">iPhone 15 Pro</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(255, 235)">
    <polygon points="0,15 25,0 25,10 60,10 60,20 25,20 25,30" fill="#0088CF"/>
  </g>

  <!-- Event 2: EDIT -->
  <g transform="translate(340, 140)">
    <circle cx="100" cy="110" r="40" fill="#1f2937" stroke="#eab308" stroke-width="3" filter="url(#glow2)"/>
    <text x="100" y="105" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="24">✏️</text>
    <text x="100" y="125" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="10">⚠ AI EDIT</text>

    <rect x="20" y="170" width="160" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="20" y="170" width="160" height="30" rx="8" fill="#eab308"/>
    <rect x="20" y="192" width="160" height="8" fill="#eab308"/>
    <text x="100" y="190" text-anchor="middle" fill="#1f2937" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AI_EDIT</text>

    <text x="30" y="220" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Event Hash:</text>
    <text x="30" y="235" fill="#05B8BC" font-family="monospace" font-size="9">f7g8h9i0j1k2...</text>

    <text x="30" y="255" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Previous:</text>
    <text x="30" y="270" fill="#05B8BC" font-family="monospace" font-size="9">a1b2c3d4e5f6...</text>

    <text x="30" y="290" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Model:</text>
    <text x="30" y="305" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">enhancement_v1</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(515, 235)">
    <polygon points="0,15 25,0 25,10 60,10 60,20 25,20 25,30" fill="#0088CF"/>
  </g>

  <!-- Event 3: SIGN -->
  <g transform="translate(600, 140)">
    <circle cx="100" cy="110" r="40" fill="#1f2937" stroke="#22c55e" stroke-width="3" filter="url(#glow2)"/>
    <text x="100" y="105" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="24">🔐</text>
    <text x="100" y="125" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">✓ VALID</text>

    <rect x="20" y="170" width="160" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="20" y="170" width="160" height="30" rx="8" fill="#22c55e"/>
    <rect x="20" y="192" width="160" height="8" fill="#22c55e"/>
    <text x="100" y="190" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SIGN</text>

    <text x="30" y="220" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Event Hash:</text>
    <text x="30" y="235" fill="#05B8BC" font-family="monospace" font-size="9">m3n4o5p6q7r8...</text>

    <text x="30" y="255" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Previous:</text>
    <text x="30" y="270" fill="#05B8BC" font-family="monospace" font-size="9">f7g8h9i0j1k2...</text>

    <text x="30" y="290" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Signer:</text>
    <text x="30" y="305" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">Reuters Editor</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(775, 235)">
    <polygon points="0,15 25,0 25,10 60,10 60,20 25,20 25,30" fill="#0088CF"/>
  </g>

  <!-- Event 4: PUBLISH -->
  <g transform="translate(860, 140)">
    <circle cx="100" cy="110" r="40" fill="#1f2937" stroke="#05B8BC" stroke-width="3" filter="url(#glow2)"/>
    <text x="100" y="105" text-anchor="middle" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="24">🌐</text>
    <text x="100" y="125" text-anchor="middle" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="10">✓ LOGGED</text>

    <rect x="20" y="170" width="160" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="20" y="170" width="160" height="30" rx="8" fill="#05B8BC"/>
    <rect x="20" y="192" width="160" height="8" fill="#05B8BC"/>
    <text x="100" y="190" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PUBLISH</text>

    <text x="30" y="220" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Event Hash:</text>
    <text x="30" y="235" fill="#05B8BC" font-family="monospace" font-size="9">s9t0u1v2w3x4...</text>

    <text x="30" y="255" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Previous:</text>
    <text x="30" y="270" fill="#05B8BC" font-family="monospace" font-size="9">m3n4o5p6q7r8...</text>

    <text x="30" y="290" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Log Index:</text>
    <text x="30" y="305" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="9">#847291</text>
  </g>

  <!-- Chain Integrity Box -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="500" height="100" rx="12" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
    <circle cx="40" cy="50" r="25" fill="#0d3d2d" stroke="#22c55e" stroke-width="2"/>
    <text x="40" y="57" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="20">✓</text>

    <text x="80" y="35" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Chain Integrity: VALID</text>
    <text x="80" y="55" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">All 4 events linked correctly</text>
    <text x="80" y="75" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Each event hash references previous event</text>
    <text x="80" y="90" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Signatures verified against trusted keys</text>
  </g>

  <!-- AI Detection Box -->
  <g transform="translate(620, 460)">
    <rect x="0" y="0" width="500" height="100" rx="12" fill="#1f2937" stroke="#eab308" stroke-width="2"/>
    <circle cx="40" cy="50" r="25" fill="#3d3d0d" stroke="#eab308" stroke-width="2"/>
    <text x="40" y="57" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="20">!</text>

    <text x="80" y="35" fill="#eab308" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">AI Modification Detected</text>
    <text x="80" y="55" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">1 AI_EDIT event in provenance chain</text>
    <text x="80" y="75" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Model: enhancement_v1 (image enhancement)</text>
    <text x="80" y="90" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">Human-Origin Proof: PARTIAL</text>
  </g>

  <!-- Footer -->
  <text x="600" y="585" text-anchor="middle" fill="#4b5563" font-family="system-ui, sans-serif" font-size="11">Verity Trust Infrastructure - Immutable Content History</text>
</svg>