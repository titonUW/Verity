<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#005CCE"/>
      <stop offset="100%" style="stop-color:#0088CF"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088CF"/>
      <stop offset="100%" style="stop-color:#05B8BC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0088CF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Verity Verification Pipeline</text>
  <text x="600" y="80" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Three-Layer Trust Assessment</text>

  <!-- Stage 1: File Intake -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1f2937" stroke="#005CCE" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="40" rx="12" fill="url(#blueGrad)"/>
    <rect x="0" y="28" width="200" height="12" fill="url(#blueGrad)"/>
    <text x="100" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. FILE INTAKE</text>
    <text x="100" y="65" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Upload Content</text>
    <text x="100" y="85" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">SHA-256 Hash</text>
    <text x="100" y="105" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Extract Metadata</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="310" y1="200" x2="380" y2="200" stroke="#0088CF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: Signal Analysis -->
  <g transform="translate(400, 140)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1f2937" stroke="#0088CF" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="40" rx="12" fill="url(#tealGrad)"/>
    <rect x="0" y="28" width="200" height="12" fill="url(#tealGrad)"/>
    <text x="100" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. SIGNAL ANALYSIS</text>
    <text x="100" y="65" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">10 Verification Signals</text>
    <text x="100" y="85" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Provenance Chain</text>
    <text x="100" y="105" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Signature Validation</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="610" y1="200" x2="680" y2="200" stroke="#0088CF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: Confidence Scoring -->
  <g transform="translate(700, 140)">
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#1f2937" stroke="#05B8BC" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="40" rx="12" fill="#05B8BC"/>
    <rect x="0" y="28" width="200" height="12" fill="#05B8BC"/>
    <text x="100" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. SCORING</text>
    <text x="100" y="65" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Reality Confidence 0-100</text>
    <text x="100" y="85" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Human-Origin Proof</text>
    <text x="100" y="105" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Grade: A-F</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="910" y1="200" x2="980" y2="200" stroke="#0088CF" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Stage 4: Policy Decision -->
  <g transform="translate(1000, 140)">
    <rect x="0" y="0" width="160" height="120" rx="12" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#22c55e"/>
    <rect x="0" y="28" width="160" height="12" fill="#22c55e"/>
    <text x="80" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">4. DECISION</text>
    <text x="80" y="65" text-anchor="middle" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">Policy Evaluation</text>
    <text x="80" y="85" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Context Rules</text>
    <text x="80" y="105" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Action Gate</text>
  </g>

  <!-- Decision Outcomes -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Decision Outcomes</text>

    <!-- ALLOW -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="240" height="80" rx="8" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#22c55e"/>
      <text x="30" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16">✓</text>
      <text x="60" y="30" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ALLOW</text>
      <text x="60" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">High confidence content</text>
      <text x="60" y="68" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Score ≥ 80, Valid provenance</text>
    </g>

    <!-- WARN -->
    <g transform="translate(260, 30)">
      <rect x="0" y="0" width="240" height="80" rx="8" fill="#1f2937" stroke="#eab308" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#eab308"/>
      <text x="30" y="45" text-anchor="middle" fill="#1f2937" font-family="system-ui, sans-serif" font-size="16">!</text>
      <text x="60" y="30" fill="#eab308" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">WARN</text>
      <text x="60" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Moderate confidence</text>
      <text x="60" y="68" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Score 60-79, Flag for review</text>
    </g>

    <!-- REQUIRE -->
    <g transform="translate(520, 30)">
      <rect x="0" y="0" width="240" height="80" rx="8" fill="#1f2937" stroke="#f97316" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#f97316"/>
      <text x="30" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">?</text>
      <text x="60" y="30" fill="#f97316" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">REQUIRE VERIFICATION</text>
      <text x="60" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Additional checks needed</text>
      <text x="60" y="68" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Score 40-59, Manual review</text>
    </g>

    <!-- BLOCK -->
    <g transform="translate(780, 30)">
      <rect x="0" y="0" width="240" height="80" rx="8" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#ef4444"/>
      <text x="30" y="45" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16">✕</text>
      <text x="60" y="30" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">BLOCK</text>
      <text x="60" y="50" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Untrusted content</text>
      <text x="60" y="68" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Score &lt; 40, Invalid chain</text>
    </g>
  </g>

  <!-- Trust Report Output -->
  <g transform="translate(100, 480)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Trust Report Output</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="1020" height="160" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>

      <!-- Human Origin -->
      <g transform="translate(30, 30)">
        <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">HUMAN-ORIGIN PROOF</text>
        <rect x="0" y="10" width="200" height="40" rx="6" fill="#0d3d2d" stroke="#22c55e" stroke-width="1"/>
        <text x="100" y="36" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">YES</text>
        <text x="0" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Verified capture device signature</text>
        <text x="0" y="85" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">No AI generation detected</text>
      </g>

      <!-- Confidence Score -->
      <g transform="translate(280, 30)">
        <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">REALITY CONFIDENCE</text>
        <rect x="0" y="10" width="200" height="40" rx="6" fill="#1e3a5f" stroke="#0088CF" stroke-width="1"/>
        <text x="100" y="36" text-anchor="middle" fill="#0088CF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">87 / 100</text>
        <rect x="0" y="60" width="200" height="8" rx="4" fill="#374151"/>
        <rect x="0" y="60" width="174" height="8" rx="4" fill="url(#tealGrad)"/>
        <text x="0" y="85" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Grade: A (Highly Trusted)</text>
      </g>

      <!-- Policy Decision -->
      <g transform="translate(530, 30)">
        <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">CONTEXT POLICY</text>
        <rect x="0" y="10" width="200" height="40" rx="6" fill="#0d3d2d" stroke="#22c55e" stroke-width="1"/>
        <text x="100" y="36" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">ALLOW</text>
        <text x="0" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Workflow: news_media</text>
        <text x="0" y="85" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">All policy rules satisfied</text>
      </g>

      <!-- Verification -->
      <g transform="translate(780, 30)">
        <text x="0" y="0" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">EXTERNAL VERIFIABILITY</text>
        <rect x="0" y="10" width="200" height="40" rx="6" fill="#1e3a5f" stroke="#05B8BC" stroke-width="1"/>
        <text x="100" y="36" text-anchor="middle" fill="#05B8BC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">VERIFIED</text>
        <text x="0" y="70" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Merkle proof in transparency log</text>
        <text x="0" y="85" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Independently auditable</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="680" text-anchor="middle" fill="#4b5563" font-family="system-ui, sans-serif" font-size="11">Verity Trust Infrastructure - Content Authenticity at Scale</text>
</svg>